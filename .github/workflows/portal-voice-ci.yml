name: Portal Voice Presence CI

on:
  pull_request:
    paths:
      - "presence_bridge.py"
      - "aiciv_inbox.py"
      - "aiciv_projects.py"
      - "portal_entrypoint.py"
      - "start.sh"
      - "test_presence_bridge.py"
      - "test_aiciv_inbox.py"
      - "test_aiciv_projects.py"
      - "react-portal/**"
      - ".github/workflows/portal-voice-ci.yml"
  push:
    branches: [main]
    paths:
      - "presence_bridge.py"
      - "aiciv_inbox.py"
      - "aiciv_projects.py"
      - "portal_entrypoint.py"
      - "start.sh"
      - "test_presence_bridge.py"
      - "test_aiciv_inbox.py"
      - "test_aiciv_projects.py"
      - "react-portal/**"
      - ".github/workflows/portal-voice-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused Portal test dependencies
        run: pip install starlette httpx
      - name: Compile AICIV extension modules
        run: python -m py_compile presence_bridge.py aiciv_inbox.py aiciv_projects.py portal_entrypoint.py
      - name: Run Presence bridge tests
        run: python test_presence_bridge.py
      - name: Run shared AICIV inbox tests
        run: python test_aiciv_inbox.py
      - name: Run shared AICIV project tests
        run: python test_aiciv_projects.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: react-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-portal/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit shipped production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm test
