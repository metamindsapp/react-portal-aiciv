name: Portal Voice Presence CI

on:
  pull_request:
    paths:
      - "presence_bridge.py"
      - "portal_entrypoint.py"
      - "start.sh"
      - "test_presence_bridge.py"
      - "react-portal/**"
      - ".github/workflows/portal-voice-ci.yml"
  push:
    branches: [main]
    paths:
      - "presence_bridge.py"
      - "portal_entrypoint.py"
      - "start.sh"
      - "test_presence_bridge.py"
      - "react-portal/**"
      - ".github/workflows/portal-voice-ci.yml"

# TEMPORARY on this branch only: the frontend job commits the lockfile generated
# from this same trusted, in-repository PR. This permission is removed as soon
# as the lock lands; the permanent workflow returns to contents: read + npm ci.
permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused Portal test dependencies
        run: pip install starlette httpx
      - name: Compile Presence bridge and wrapper
        run: python -m py_compile presence_bridge.py portal_entrypoint.py
      - name: Run Presence bridge tests
        run: python test_presence_bridge.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: react-portal
    steps:
      - uses: actions/checkout@v4
        with:
          # PR workflows normally check out a synthetic merge ref. For this one
          # lock-refresh run we need the actual same-repo head branch so the bot
          # can commit only the generated lock back to that branch.
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Commit refreshed package lock
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh frontend lockfile"
          git push origin "HEAD:${BRANCH}"
      - name: Audit shipped production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm test
