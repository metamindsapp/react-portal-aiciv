name: Portal Voice Presence CI

on:
  pull_request:
    paths:
      - "presence_bridge.py"
      - "portal_entrypoint.py"
      - "start.sh"
      - "test_presence_bridge.py"
      - "react-portal/**"
      - ".github/workflows/portal-voice-ci.yml"
  push:
    branches: [main]
    paths:
      - "presence_bridge.py"
      - "portal_entrypoint.py"
      - "start.sh"
      - "test_presence_bridge.py"
      - "react-portal/**"
      - ".github/workflows/portal-voice-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused Portal test dependencies
        run: pip install starlette httpx
      - name: Compile Presence bridge and wrapper
        run: python -m py_compile presence_bridge.py portal_entrypoint.py
      - name: Run Presence bridge tests
        run: python test_presence_bridge.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: react-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm install is temporary while this PR refreshes the repository's stale
      # lockfile. The generated lock is exported below, committed back to the
      # branch, and this workflow will then switch permanently to npm ci.
      - run: npm install
      - name: Export refreshed package lock
        uses: actions/upload-artifact@v4
        with:
          name: react-portal-package-lock
          path: react-portal/package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Audit shipped production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm test
